name: One-time Magic wake-word fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Apply fixed Magic wake word') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace wake-word aliases
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/services/voiceEngine.ts')
          text = path.read_text(encoding='utf-8')

          pattern = re.compile(
              r'  private getWakeWordAliases\(\): string\[\] \{.*?\n  \}\n\n  private parseWakeWord',
              re.S,
          )

          replacement = '''  private getWakeWordAliases(): string[] {
    // The spoken wake word is intentionally independent from the assistant's
    // display name. The UI can say "ma9icAI", but the microphone wake word is
    // always the simple spoken word "Magic".
    return ["magic"];
  }

  private parseWakeWord'''

          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Could not locate getWakeWordAliases in root src/services/voiceEngine.ts')

          path.write_text(updated, encoding='utf-8')

      - name: Commit source fix and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-magic-wakeword.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/services/voiceEngine.ts .github/workflows/fix-magic-wakeword.yml
          git commit -m 'Apply fixed Magic wake word' || exit 0
          git push

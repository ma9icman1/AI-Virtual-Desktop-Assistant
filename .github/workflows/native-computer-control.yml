name: Native computer control

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  rust-sidecar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
      - name: Build native computer-control sidecar
        run: cargo build --release --manifest-path native/computer-control/Cargo.toml

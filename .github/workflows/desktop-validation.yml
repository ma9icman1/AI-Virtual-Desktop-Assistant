name: Desktop validation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout branch under test
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Regenerate stale lockfile on same-repository PRs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: pwsh
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "fix: regenerate package lockfile from package.json"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push origin "HEAD:$env:GITHUB_HEAD_REF"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check Electron JavaScript
        shell: pwsh
        run: |
          node --check electron/main.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check electron/computer-control.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check electron/preload.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

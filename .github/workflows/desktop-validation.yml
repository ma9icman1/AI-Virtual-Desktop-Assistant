name: Desktop validation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check Electron JavaScript
        shell: pwsh
        run: |
          node --check electron/main.cjs
          node --check electron/computer-control.cjs
          node --check electron/preload.cjs

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <!-- Radial Lip Shading for Pursed O Shape -->
    <radialGradient id="pursedLipGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#cb4864"/>
      <stop offset="60%" stop-color="#e0627c"/>
      <stop offset="85%" stop-color="#f46e88"/>
      <stop offset="100%" stop-color="#931d37"/>
    </radialGradient>

    <!-- Pursed Lip Gloss Ring -->
    <radialGradient id="pursedGloss" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="pursedOralDepth" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#4a0818"/>
      <stop offset="70%" stop-color="#24020a"/>
      <stop offset="100%" stop-color="#0a0003"/>
    </radialGradient>
  </defs>

  <!-- Shadow under pursed lip -->
  <ellipse cx="200" cy="305" rx="16" ry="4" fill="#883b1d" opacity="0.35"/>

  <!-- Pursed Outer Lip Body -->
  <ellipse cx="200" cy="289" rx="17" ry="14" fill="url(#pursedLipGrad)"/>

  <!-- Inner Dark Oral Hole -->
  <ellipse cx="200" cy="289" rx="8" ry="7.5" fill="url(#pursedOralDepth)"/>

  <!-- Subtle upper teeth visible at top rim of hole -->
  <path d="M 194 286 C 196 287.5, 204 287.5, 206 286 Z" fill="#f8fafc"/>

  <!-- Specular Gloss on Lower Pursed Edge -->
  <ellipse cx="200" cy="298" rx="8" ry="3" fill="url(#pursedGloss)"/>
  <ellipse cx="200" cy="297" rx="4" ry="1.2" fill="#ffffff" opacity="0.75"/>

  <!-- Specular Gloss on Upper Cupid's Ridge -->
  <ellipse cx="200" cy="279" rx="5" ry="2" fill="url(#pursedGloss)"/>
  <circle cx="197" cy="279" r="1.1" fill="#ffffff" opacity="0.7"/>
  <circle cx="203" cy="279" r="1.1" fill="#ffffff" opacity="0.7"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="lidClosedSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff1e5"/>
      <stop offset="40%" stop-color="#fedcc5"/>
      <stop offset="85%" stop-color="#f8c3a3"/>
      <stop offset="100%" stop-color="#d4794e"/>
    </linearGradient>

    <radialGradient id="lidHighlight" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Left Eye Closed -->
  <!-- Eyelid surface contour -->
  <path d="M 146 195 C 151 187, 174 186, 184 195 C 178 200, 152 200, 146 195 Z"
        fill="url(#lidClosedSkin)"/>
  <ellipse cx="165" cy="193" rx="10" ry="5" fill="url(#lidHighlight)"/>

  <!-- Closed lash seam -->
  <path d="M 145 197 C 153 203, 175 203, 184 196"
        stroke="#090a0f" stroke-width="2.4" stroke-linecap="round" fill="none"/>

  <!-- Downward sweeping lashes Left -->
  <path d="M 144 197 C 140 200, 137 205, 136 211" stroke="#050608" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M 148 199 C 146 204, 144 209, 143 213" stroke="#050608" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <path d="M 154 201 C 152 206, 151 210, 150 215" stroke="#050608" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  <path d="M 160 202 C 160 207, 159 211, 159 216" stroke="#050608" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  <path d="M 167 202 C 168 207, 169 211, 169 216" stroke="#050608" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  <path d="M 174 201 C 176 206, 178 210, 179 214" stroke="#050608" stroke-width="1.3" stroke-linecap="round" fill="none"/>
  <path d="M 180 198 C 182 202, 185 206, 187 209" stroke="#050608" stroke-width="1.1" stroke-linecap="round" fill="none"/>

  <!-- Right Eye Closed -->
  <!-- Eyelid surface contour -->
  <path d="M 216 195 C 226 186, 249 187, 254 195 C 248 200, 222 200, 216 195 Z"
        fill="url(#lidClosedSkin)"/>
  <ellipse cx="235" cy="193" rx="10" ry="5" fill="url(#lidHighlight)"/>

  <!-- Closed lash seam -->
  <path d="M 216 196 C 225 203, 247 203, 255 197"
        stroke="#090a0f" stroke-width="2.4" stroke-linecap="round" fill="none"/>

  <!-- Downward sweeping lashes Right -->
  <path d="M 256 197 C 260 200, 263 205, 264 211" stroke="#050608" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M 252 199 C 254 204, 256 209, 257 213" stroke="#050608" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <path d="M 246 201 C 248 206, 249 210, 250 215" stroke="#050608" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  <path d="M 240 202 C 240 207, 241 211, 241 216" stroke="#050608" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  <path d="M 233 202 C 232 207, 231 211, 231 216" stroke="#050608" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  <path d="M 226 201 C 224 206, 222 210, 221 214" stroke="#050608" stroke-width="1.3" stroke-linecap="round" fill="none"/>
  <path d="M 220 198 C 218 202, 215 206, 213 209" stroke="#050608" stroke-width="1.1" stroke-linecap="round" fill="none"/>
</svg>

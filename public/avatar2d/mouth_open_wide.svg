<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="upperLipWide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0627c"/>
      <stop offset="50%" stop-color="#cb4864"/>
      <stop offset="100%" stop-color="#9f2842"/>
    </linearGradient>

    <linearGradient id="lowerLipWide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f46e88"/>
      <stop offset="40%" stop-color="#e2506e"/>
      <stop offset="85%" stop-color="#c43354"/>
      <stop offset="100%" stop-color="#931d37"/>
    </linearGradient>

    <!-- Deep oral cavity -->
    <radialGradient id="oralDepthWide" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#3b0512"/>
      <stop offset="65%" stop-color="#1c0107"/>
      <stop offset="100%" stop-color="#080002"/>
    </radialGradient>

    <!-- Tongue -->
    <radialGradient id="tongueGrad" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="55%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </radialGradient>

    <radialGradient id="lipGlossWide" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="85%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Shadow under lower lip -->
  <ellipse cx="200" cy="309" rx="20" ry="4" fill="#883b1d" opacity="0.38"/>

  <!-- Deep Oral Cavity Opening -->
  <path d="M 176 286 C 185 281, 215 281, 224 286
           C 222 301, 178 301, 176 286 Z"
        fill="url(#oralDepthWide)"/>

  <!-- Tongue in Lower Cavity -->
  <path d="M 183 297 C 190 293, 210 293, 217 297
           C 213 301, 187 301, 183 297 Z"
        fill="url(#tongueGrad)"/>

  <!-- Upper Teeth Arc -->
  <path d="M 182 284 C 190 285.5, 210 285.5, 218 284
           C 217 290, 183 290, 182 284 Z"
        fill="#f8fafc"/>
  <line x1="200" y1="285" x2="200" y2="290" stroke="#cbd5e1" stroke-width="0.8"/>
  <line x1="193" y1="285" x2="193" y2="289" stroke="#e2e8f0" stroke-width="0.6"/>
  <line x1="207" y1="285" x2="207" y2="289" stroke="#e2e8f0" stroke-width="0.6"/>

  <!-- Lower Lip Pulled Down -->
  <path d="M 175 288 C 182 306, 218 306, 225 288
           C 220 306, 212 308, 200 308
           C 188 308, 180 306, 175 288 Z"
        fill="url(#lowerLipWide)"/>

  <!-- Gloss on Lower Lip -->
  <ellipse cx="200" cy="300" rx="14" ry="4" fill="url(#lipGlossWide)"/>
  <ellipse cx="200" cy="298" rx="8" ry="1.6" fill="#ffffff" opacity="0.6"/>

  <!-- Upper Lip -->
  <path d="M 175 286 C 182 281, 189 276, 195 277
           C 198 278, 200 280, 200 280
           C 200 280, 202 278, 205 277
           C 211 276, 218 281, 225 286
           C 215 287, 205 285.5, 200 285
           C 195 285.5, 185 287, 175 286 Z"
        fill="url(#upperLipWide)"/>

  <!-- Highlights -->
  <circle cx="195" cy="277" r="1.4" fill="#ffffff" opacity="0.75"/>
  <circle cx="205" cy="277" r="1.4" fill="#ffffff" opacity="0.75"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <!-- Upper Lip Gradient: Subtle Rose-Mauve with Contour -->
    <linearGradient id="upperLipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0627c"/>
      <stop offset="45%" stop-color="#cb4864"/>
      <stop offset="100%" stop-color="#9f2842"/>
    </linearGradient>

    <!-- Lower Lip Gradient: Plumper, Full Rose with Depth -->
    <linearGradient id="lowerLipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f46e88"/>
      <stop offset="40%" stop-color="#e2506e"/>
      <stop offset="85%" stop-color="#c43354"/>
      <stop offset="100%" stop-color="#931d37"/>
    </linearGradient>

    <!-- High Gloss Wet Specular Reflection (Lower Lip Center) -->
    <radialGradient id="lipGlossCenter" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="85%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Cupid's Bow Peak Specular Highlight -->
    <radialGradient id="cupidGleam" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Lip Shadow Under Lower Lip (Mentolabial Sulcus) -->
    <radialGradient id="chinShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#883b1d" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#883b1d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Shadow under lower lip for 3D fullness -->
  <ellipse cx="200" cy="303" rx="20" ry="4" fill="url(#chinShadow)"/>

  <!-- Lower Lip -->
  <path d="M 175 287 C 182 299, 218 299, 225 287
           C 220 299, 212 301, 200 301
           C 188 301, 180 299, 175 287 Z"
        fill="url(#lowerLipGrad)"/>

  <!-- Lower Lip Wet Gloss Highlight -->
  <ellipse cx="200" cy="293" rx="14" ry="4" fill="url(#lipGlossCenter)"/>
  <ellipse cx="200" cy="291" rx="8" ry="1.8" fill="#ffffff" opacity="0.6"/>

  <!-- Upper Lip with Defined Cupid's Bow -->
  <path d="M 175 287 C 182 284, 189 278, 195 279
           C 198 280, 200 282, 200 282
           C 200 282, 202 280, 205 279
           C 211 278, 218 284, 225 287
           C 215 288, 206 288, 200 286.5
           C 194 288, 185 288, 175 287 Z"
        fill="url(#upperLipGrad)"/>

  <!-- Cupid's Bow Gleam Highlights -->
  <circle cx="195" cy="279" r="1.5" fill="url(#cupidGleam)"/>
  <circle cx="205" cy="279" r="1.5" fill="url(#cupidGleam)"/>

  <!-- Center Lip Part Seam & Mouth Corners -->
  <path d="M 175 287 C 185 288, 194 288, 200 286.5
           C 206 288, 215 288, 225 287"
        stroke="#590d1f" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <!-- Corner nodes -->
  <circle cx="174" cy="287" r="1.1" fill="#4c0817"/>
  <circle cx="226" cy="287" r="1.1" fill="#4c0817"/>
</svg>

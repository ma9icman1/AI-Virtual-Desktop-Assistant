<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <!-- Upper lip base: rich rose-mauve -->
    <linearGradient id="upperLipClosed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#e85b7a"/>
      <stop offset="35%"  stop-color="#d44d6a"/>
      <stop offset="100%" stop-color="#b03055"/>
    </linearGradient>
    <!-- Lower lip base: fuller, rosier -->
    <linearGradient id="lowerLipClosed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#e8506c"/>
      <stop offset="50%"  stop-color="#d44060"/>
      <stop offset="100%" stop-color="#aa2e50"/>
    </linearGradient>
    <!-- Wet highlight on lower lip -->
    <radialGradient id="lipWetClosed" cx="50%" cy="30%" r="55%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.62"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- Upper lip wet sheen -->
    <radialGradient id="upperLipWet" cx="50%" cy="40%" r="50%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- Lip corner shadow -->
    <radialGradient id="cornerShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#7f1d3f" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7f1d3f" stop-opacity="0"/>
    </radialGradient>
    <filter id="lipSoft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g id="mouthClosed">
    <!-- Philtrum shadow (columns above upper lip) -->
    <path d="M 196 252 C 197 255, 200 256, 203 255 C 201 253, 199 253, 196 252 Z"
          fill="#c07050" opacity="0.3"/>

    <!-- Upper lip filled shape (with cupid's bow) -->
    <path d="M 185 260
             C 188 257, 192 255, 196 256
             C 198 254, 200 253.5, 202 254
             C 205 253, 209 255, 213 258
             C 208 259, 202 260, 200 260
             C 198 260, 192 260, 185 260 Z"
          fill="url(#upperLipClosed)" filter="url(#lipSoft)"/>

    <!-- Upper lip wet sheen -->
    <ellipse cx="200" cy="257" rx="10" ry="2.2" fill="url(#upperLipWet)" opacity="0.9"/>

    <!-- Lip seam / parting line -->
    <path d="M 184 260 C 192 261.5, 208 261.5, 216 260"
          stroke="#881337" stroke-width="1.8" stroke-linecap="round" fill="none"/>

    <!-- Corner lip shadows -->
    <ellipse cx="184" cy="260" rx="3" ry="2" fill="url(#cornerShadow)"/>
    <ellipse cx="216" cy="260" rx="3" ry="2" fill="url(#cornerShadow)"/>

    <!-- Lower lip filled shape (fuller, plump) -->
    <path d="M 184 260
             C 188 264, 195 268, 200 268
             C 205 268, 212 264, 216 260
             C 210 261.5, 190 261.5, 184 260 Z"
          fill="url(#lowerLipClosed)" filter="url(#lipSoft)"/>

    <!-- Lower lip wet highlight (main plump catch-light) -->
    <ellipse cx="200" cy="263" rx="9" ry="3.5" fill="url(#lipWetClosed)" opacity="0.9"/>
    <!-- Secondary tiny specular -->
    <ellipse cx="196" cy="262" rx="3.5" ry="1.5" fill="#ffffff" opacity="0.45"/>

    <!-- Chin shadow / sub-labial fold -->
    <path d="M 190 270 C 195 272, 205 272, 210 270"
          stroke="#c07858" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.35"/>

    <!-- Vermilion border (upper lip outline) -->
    <path d="M 184 260 C 188 257, 192 254.5, 196 255.5 C 198 253.5, 200 253, 202 253.5 C 206 254.5, 210 257, 215 260"
          stroke="#9f1239" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.7"/>
  </g>
</svg>

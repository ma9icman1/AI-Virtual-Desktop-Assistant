<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <!-- Photorealistic Iris: Multi-depth Sapphire Ocean Blue with Turquoise Inner Ring -->
    <radialGradient id="irisGrad" cx="44%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#cffafe"/>
      <stop offset="22%" stop-color="#38bdf8"/>
      <stop offset="52%" stop-color="#0284c7"/>
      <stop offset="78%" stop-color="#0369a1"/>
      <stop offset="92%" stop-color="#075985"/>
      <stop offset="100%" stop-color="#082f49"/>
    </radialGradient>

    <!-- Limbal Ring -->
    <radialGradient id="limbalRing" cx="50%" cy="50%" r="50%">
      <stop offset="76%" stop-color="#021a2e" stop-opacity="0"/>
      <stop offset="92%" stop-color="#021424" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#010c14" stop-opacity="0.95"/>
    </radialGradient>

    <!-- Amber / Honey Hazel Flecks around Pupil -->
    <radialGradient id="hazelFlecks" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </radialGradient>

    <!-- Glassy Catch-Light (Corneal Specular Reflection) -->
    <radialGradient id="primaryGleam" cx="35%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1.0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="75%" stop-color="#e0f2fe" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0"/>
    </radialGradient>

    <!-- Secondary Soft Rim Catch-light -->
    <radialGradient id="rimGleam" cx="65%" cy="70%" r="35%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>

    <!-- Sclera 3D Spherical Shading -->
    <linearGradient id="scleraShading" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="25%" stop-color="#f1f5f9"/>
      <stop offset="70%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <!-- Upper Lid Cast Shadow -->
    <linearGradient id="lidShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </linearGradient>

    <!-- Eyelid Crease -->
    <linearGradient id="creaseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#831843" stop-opacity="0.45"/>
    </linearGradient>

    <clipPath id="leftEyeClip">
      <path d="M 146 195 C 151 185, 174 184, 184 194 C 176 203, 153 204, 146 195 Z"/>
    </clipPath>

    <clipPath id="rightEyeClip">
      <path d="M 216 194 C 226 184, 249 185, 254 195 C 247 204, 224 203, 216 194 Z"/>
    </clipPath>
  </defs>

  <!-- ══════════════════════════════════
       LEFT EYE (Center at X 165, Y 194)
       ══════════════════════════════════ -->
  <!-- Upper Crease -->
  <path d="M 148 186 C 157 181, 173 180, 182 187"
        stroke="url(#creaseGrad)" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- Eyeball Clip -->
  <g clip-path="url(#leftEyeClip)">
    <rect x="144" y="182" width="42" height="24" fill="url(#scleraShading)"/>
    
    <!-- Tear duct pink -->
    <ellipse cx="183" cy="195" rx="3.5" ry="2.2" fill="#f43f5e" opacity="0.6"/>
    <circle cx="183.5" cy="194.5" r="0.8" fill="#ffffff" opacity="0.8"/>

    <!-- Iris (X 165, Y 194) -->
    <circle cx="165" cy="194" r="9.2" fill="url(#irisGrad)"/>
    <circle cx="165" cy="194" r="9.2" fill="url(#limbalRing)"/>
    <circle cx="165" cy="194" r="5.2" fill="url(#hazelFlecks)"/>

    <!-- Pupil -->
    <circle cx="165" cy="194" r="3.6" fill="#020617"/>

    <!-- Catch-lights -->
    <ellipse cx="163" cy="191.5" rx="2.5" ry="1.8" fill="url(#primaryGleam)" transform="rotate(-15 163 191.5)"/>
    <circle cx="167" cy="196" r="1.1" fill="url(#rimGleam)"/>

    <!-- Cast shadow -->
    <rect x="144" y="183" width="42" height="6.5" fill="url(#lidShadow)"/>
  </g>

  <!-- Tightline / Eyelid Margins -->
  <path d="M 146 195 C 151 185, 174 184, 184 194"
        stroke="#090a0f" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <!-- Wet line shine -->
  <path d="M 148 196 C 154 203, 175 202, 183 195"
        stroke="#ffffff" stroke-width="0.8" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- Natural Curled Eyelashes (Curving toward outer temple) -->
  <!-- Outer wing clusters -->
  <path d="M 145 195 C 140 193, 136 189, 134 184" stroke="#050608" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M 146 194 C 142 190, 139 185, 139 180" stroke="#050608" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <path d="M 149 191 C 146 186, 144 181, 145 176" stroke="#050608" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Center lid fan -->
  <path d="M 154 188 C 152 182, 152 177, 153 173" stroke="#050608" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  <path d="M 160 186 C 160 180, 161 176, 163 172" stroke="#050608" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  <path d="M 166 185 C 167 180, 170 176, 172 173" stroke="#050608" stroke-width="1.3" stroke-linecap="round" fill="none"/>
  <path d="M 172 186 C 174 182, 178 179, 180 176" stroke="#050608" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <path d="M 178 189 C 180 185, 183 182, 185 180" stroke="#050608" stroke-width="1.0" stroke-linecap="round" fill="none"/>

  <!-- Delicate Lower Lashes -->
  <path d="M 150 198 C 148 201, 147 204, 146 206" stroke="#1e293b" stroke-width="0.8" stroke-linecap="round" fill="none"/>
  <path d="M 158 201 C 158 204, 158 206, 157 208" stroke="#1e293b" stroke-width="0.8" stroke-linecap="round" fill="none"/>
  <path d="M 167 201 C 168 204, 169 206, 170 208" stroke="#1e293b" stroke-width="0.8" stroke-linecap="round" fill="none"/>

  <!-- ══════════════════════════════════
       RIGHT EYE (Center at X 235, Y 194)
       ══════════════════════════════════ -->
  <!-- Upper Crease -->
  <path d="M 218 187 C 227 180, 243 181, 252 186"
        stroke="url(#creaseGrad)" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- Eyeball Clip -->
  <g clip-path="url(#rightEyeClip)">
    <rect x="214" y="182" width="42" height="24" fill="url(#scleraShading)"/>
    
    <!-- Tear duct pink -->
    <ellipse cx="217" cy="195" rx="3.5" ry="2.2" fill="#f43f5e" opacity="0.6"/>
    <circle cx="216.5" cy="194.5" r="0.8" fill="#ffffff" opacity="0.8"/>

    <!-- Iris (X 235, Y 194) -->
    <circle cx="235" cy="194" r="9.2" fill="url(#irisGrad)"/>
    <circle cx="235" cy="194" r="9.2" fill="url(#limbalRing)"/>
    <circle cx="235" cy="194" r="5.2" fill="url(#hazelFlecks)"/>

    <!-- Pupil -->
    <circle cx="235" cy="194" r="3.6" fill="#020617"/>

    <!-- Catch-lights -->
    <ellipse cx="233" cy="191.5" rx="2.5" ry="1.8" fill="url(#primaryGleam)" transform="rotate(-15 233 191.5)"/>
    <circle cx="237" cy="196" r="1.1" fill="url(#rimGleam)"/>

    <!-- Cast shadow -->
    <rect x="214" y="183" width="42" height="6.5" fill="url(#lidShadow)"/>
  </g>

  <!-- Tightline / Eyelid Margins -->
  <path d="M 216 194 C 226 184, 249 185, 254 195"
        stroke="#090a0f" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <!-- Wet line shine -->
  <path d="M 217 195 C 225 202, 246 203, 252 196"
        stroke="#ffffff" stroke-width="0.8" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- Natural Curled Eyelashes (Curving toward outer temple) -->
  <!-- Outer wing clusters -->
  <path d="M 255 195 C 260 193, 264 189, 266 184" stroke="#050608" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M 254 194 C 258 190, 261 185, 261 180" stroke="#050608" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <path d="M 251 191 C 254 186, 256 181, 255 176" stroke="#050608" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Center lid fan -->
  <path d="M 246 188 C 248 182, 248 177, 247 173" stroke="#050608" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  <path d="M 240 186 C 240 180, 239 176, 237 172" stroke="#050608" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  <path d="M 234 185 C 233 180, 230 176, 228 173" stroke="#050608" stroke-width="1.3" stroke-linecap="round" fill="none"/>
  <path d="M 228 186 C 226 182, 222 179, 220 176" stroke="#050608" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <path d="M 222 189 C 220 185, 217 182, 215 180" stroke="#050608" stroke-width="1.0" stroke-linecap="round" fill="none"/>

  <!-- Delicate Lower Lashes -->
  <path d="M 250 198 C 252 201, 253 204, 254 206" stroke="#1e293b" stroke-width="0.8" stroke-linecap="round" fill="none"/>
  <path d="M 242 201 C 242 204, 242 206, 243 208" stroke="#1e293b" stroke-width="0.8" stroke-linecap="round" fill="none"/>
  <path d="M 233 201 C 232 204, 231 206, 230 208" stroke="#1e293b" stroke-width="0.8" stroke-linecap="round" fill="none"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="upperLipSmile" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0627c"/>
      <stop offset="45%" stop-color="#cb4864"/>
      <stop offset="100%" stop-color="#9f2842"/>
    </linearGradient>

    <linearGradient id="lowerLipSmile" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f46e88"/>
      <stop offset="40%" stop-color="#e2506e"/>
      <stop offset="85%" stop-color="#c43354"/>
      <stop offset="100%" stop-color="#931d37"/>
    </linearGradient>

    <radialGradient id="smileGloss" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="85%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="smileDimple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ba6844" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ba6844" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Smile corner soft shadow -->
  <ellipse cx="172" cy="284" rx="3.0" ry="4.5" fill="url(#smileDimple)"/>
  <ellipse cx="228" cy="284" rx="3.0" ry="4.5" fill="url(#smileDimple)"/>

  <!-- Shadow under lower lip -->
  <ellipse cx="200" cy="301" rx="19" ry="3.5" fill="#883b1d" opacity="0.32"/>

  <!-- Teeth peek through smile gap -->
  <path d="M 178 285 C 188 287, 212 287, 222 285
           C 220 289, 180 289, 178 285 Z" fill="#2d0611"/>
  <path d="M 183 285 C 190 286.2, 210 286.2, 217 285
           C 214 288, 186 288, 183 285 Z" fill="#f8fafc"/>
  <line x1="200" y1="285" x2="200" y2="288" stroke="#cbd5e1" stroke-width="0.7"/>

  <!-- Lower Lip Smiling -->
  <path d="M 173 283 C 180 298, 220 298, 227 283
           C 221 298, 212 300, 200 300
           C 188 300, 179 298, 173 283 Z"
        fill="url(#lowerLipSmile)"/>

  <!-- Wet Gloss on Lower Lip -->
  <ellipse cx="200" cy="292" rx="14" ry="3.8" fill="url(#smileGloss)"/>
  <ellipse cx="200" cy="290" rx="8" ry="1.5" fill="#ffffff" opacity="0.65"/>

  <!-- Upper Lip Smiling with Cupid's Bow -->
  <path d="M 173 283 C 181 280, 189 276, 195 277
           C 198 278, 200 280, 200 280
           C 200 280, 202 278, 205 277
           C 211 276, 219 280, 227 283
           C 217 285, 206 285, 200 284
           C 194 285, 183 285, 173 283 Z"
        fill="url(#upperLipSmile)"/>

  <!-- Cupid's bow highlights -->
  <circle cx="195" cy="277" r="1.3" fill="#ffffff" opacity="0.75"/>
  <circle cx="205" cy="277" r="1.3" fill="#ffffff" opacity="0.75"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="upperLipSmall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0627c"/>
      <stop offset="50%" stop-color="#cb4864"/>
      <stop offset="100%" stop-color="#9f2842"/>
    </linearGradient>

    <linearGradient id="lowerLipSmall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f46e88"/>
      <stop offset="40%" stop-color="#e2506e"/>
      <stop offset="85%" stop-color="#c43354"/>
      <stop offset="100%" stop-color="#931d37"/>
    </linearGradient>

    <!-- Oral cavity dark depth -->
    <radialGradient id="oralDepthSmall" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#4a0818"/>
      <stop offset="70%" stop-color="#24020a"/>
      <stop offset="100%" stop-color="#0e0004"/>
    </radialGradient>

    <radialGradient id="lipGlossSmall" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="85%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Shadow under lower lip -->
  <ellipse cx="200" cy="305" rx="20" ry="4" fill="#883b1d" opacity="0.35"/>

  <!-- Oral Cavity Aperture -->
  <path d="M 177 286 C 185 284, 215 284, 223 286
           C 220 294, 180 294, 177 286 Z"
        fill="url(#oralDepthSmall)"/>

  <!-- Upper Teeth Arc -->
  <path d="M 183 285 C 190 285.5, 210 285.5, 217 285
           C 216 289, 184 289, 183 285 Z"
        fill="#f8fafc"/>
  <!-- Central incisor separator line -->
  <line x1="200" y1="285" x2="200" y2="289" stroke="#cbd5e1" stroke-width="0.8"/>

  <!-- Lower Lip -->
  <path d="M 175 288 C 183 302, 217 302, 225 288
           C 220 302, 212 304, 200 304
           C 188 304, 180 302, 175 288 Z"
        fill="url(#lowerLipSmall)"/>

  <!-- Wet Gloss -->
  <ellipse cx="200" cy="296" rx="14" ry="4" fill="url(#lipGlossSmall)"/>
  <ellipse cx="200" cy="294" rx="8" ry="1.6" fill="#ffffff" opacity="0.6"/>

  <!-- Upper Lip -->
  <path d="M 175 286 C 182 282, 189 277, 195 278
           C 198 279, 200 281, 200 281
           C 200 281, 202 279, 205 278
           C 211 277, 218 282, 225 286
           C 215 287, 205 286, 200 285.5
           C 195 286, 185 287, 175 286 Z"
        fill="url(#upperLipSmall)"/>

  <!-- Cupid's bow highlights -->
  <circle cx="195" cy="278" r="1.4" fill="#ffffff" opacity="0.75"/>
  <circle cx="205" cy="278" r="1.4" fill="#ffffff" opacity="0.75"/>
</svg>
